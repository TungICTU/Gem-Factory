<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
</head>
<body>
<title>Gem Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>:root {
  --bg: #120b1f; --panel: #1e1433; --panel2: #2a1d47; --ink: #f5efff; --muted: #a99cc7;
  --accent: #ffd23f; --good: #3ddc84; --bad: #ff4d6d;
  --common: #9ad1ff; --uncommon: #3ddc84; --rare: #ff6bd6;
  color-scheme: dark; /* single deliberate dark arcade look */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Press Start 2P', ui-monospace, monospace; font-size: 12px; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.hidden { display: none !important; }
button { font: inherit; font-size: 10px; color: var(--ink); background: var(--panel2); border: 3px solid var(--ink); padding: 8px 10px; cursor: pointer; box-shadow: 3px 3px 0 #000; }
button:hover:not(:disabled) { background: #3a2a63; }
button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
button:disabled { opacity: .4; cursor: not-allowed; }
input { font: inherit; font-size: 10px; background: #000; color: var(--ink); border: 3px solid var(--ink); padding: 6px; width: 150px; }

#screen-title { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 16px; }
.logo { font-size: clamp(28px, 8vw, 56px); line-height: 1.2; margin: 0 0 8px; color: var(--accent); text-shadow: 4px 4px 0 var(--bad), 8px 8px 0 #3a86ff; animation: bob 2s steps(4) infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.sub { color: var(--muted); font-size: 10px; margin: 0 0 12px; }
.seed { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

#screen-game { display: grid; grid-template-columns: 220px auto auto; grid-template-areas: "hud board shop" "hud perks shop"; gap: 12px 16px; padding: 12px; align-items: start; max-width: 100vw; max-height: 100%; }
#hud { grid-area: hud; background: var(--panel); border: 3px solid var(--ink); padding: 12px; display: flex; flex-direction: column; gap: 14px; box-shadow: 4px 4px 0 #000; }
.stat label { display: block; color: var(--muted); font-size: 8px; margin-bottom: 6px; }
.stat .v { font-size: 15px; }
.money { color: var(--accent); }
.money.neg { color: var(--bad); }
#bar { height: 12px; border: 2px solid var(--ink); background: #000; margin-top: 6px; }
#bar-fill { height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--good) 0 6px, #2fb36b 6px 12px); transition: width .25s steps(6); }
.hud-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.hud-btns button { font-size: 8px; padding: 6px; }
#board-wrap { grid-area: board; position: relative; padding-top: 30px; }
canvas#board { display: block; image-rendering: pixelated; border: 3px solid var(--ink); box-shadow: 4px 4px 0 #000; background: #24183c; touch-action: none; }
#move-points { position: absolute; left: 50%; top: 0; transform: translateX(-50%) scale(var(--mp-scale, 1)); font-size: 18px; color: var(--accent); text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; pointer-events: none; white-space: nowrap; transition: transform .12s; z-index: 5; }
#move-points.fly { animation: fly .32s ease-in forwards; }
@keyframes fly { to { transform: translate(-50%, -30px) scale(1.6); opacity: 0; } }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
#perk-row { grid-area: perks; display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 10px; max-width: 100%; }
.perk { flex: 0 0 auto; width: 96px; height: 104px; background: var(--panel2); border: 3px solid var(--common); padding: 6px; font-size: 7px; line-height: 1.5; overflow: hidden; box-shadow: 3px 3px 0 #000; cursor: grab; touch-action: pan-x; position: relative; }
.perk.uncommon { border-color: var(--uncommon); }
.perk.rare { border-color: var(--rare); }
.perk .pn { font-size: 8px; color: var(--accent); margin-bottom: 6px; line-height: 1.3; }
.perk.empty { border-style: dashed; border-color: #4a3b70; color: #4a3b70; display: flex; align-items: center; justify-content: center; cursor: default; box-shadow: none; touch-action: pan-x; }
.perk.fire { animation: fire .35s steps(4); }
@keyframes fire { 40% { transform: translateY(-12px) scale(1.1); filter: brightness(1.8); } }
.perk.dragging { opacity: .5; }

#shop { grid-area: shop; width: 300px; background: var(--panel); border: 3px solid var(--accent); padding: 12px; box-shadow: 4px 4px 0 #000; max-height: calc(100dvh - 24px); overflow-y: auto; }
#shop h2 { margin: 0 0 10px; font-size: 16px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
#btn-shop-toggle { display: none; font-size: 8px; padding: 4px 6px; }
#shop h3 { margin: 10px 0 6px; font-size: 8px; color: var(--muted); }
.cards { display: flex; gap: 6px; flex-wrap: wrap; }
.card { width: 88px; min-height: 112px; background: var(--panel2); border: 3px solid var(--common); padding: 6px; font-size: 7px; line-height: 1.5; cursor: pointer; box-shadow: 3px 3px 0 #000; display: flex; flex-direction: column; gap: 4px; }
.card.uncommon { border-color: var(--uncommon); }
.card.rare { border-color: var(--rare); }
.card.tile, .card.upgrade { border-color: var(--accent); }
.card .cn { font-size: 8px; color: var(--accent); line-height: 1.3; }
.card .cd { flex: 1; }
.card .cp { font-size: 10px; color: var(--good); }
.card.off { opacity: .45; }
.card.sold { opacity: .25; cursor: default; align-items: center; justify-content: center; }
.card.picked { outline: 3px dashed var(--accent); outline-offset: 2px; }
.card:hover:not(.sold) { transform: translateY(-3px); }
.shop-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
#btn-next { background: #1f6b43; }
#shop-hint { font-size: 7px; line-height: 1.6; color: var(--muted); margin: 10px 0 0; }

.float { position: absolute; transform: translate(-50%, -50%); pointer-events: none; font-size: 10px; color: #fff; text-shadow: 2px 2px 0 #000; animation: floatUp .8s ease-out forwards; white-space: nowrap; z-index: 20; }
.float.mul { color: var(--bad); font-size: 16px; }
.float.money { color: var(--accent); }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(-50%, -250%); } }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 30; }
#flash.on { animation: flash .25s; }
@keyframes flash { from { opacity: .5; } to { opacity: 0; } }
#big, #toast { position: fixed; left: 50%; pointer-events: none; opacity: 0; z-index: 31; white-space: nowrap; text-shadow: 4px 4px 0 #000; }
#big { top: 40%; font-size: 48px; color: var(--bad); }
#toast { top: 18%; font-size: 16px; color: var(--accent); }
#big.on, #toast.on { animation: pop .7s; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.25); } 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }
#modal { position: fixed; inset: 0; background: rgba(8, 4, 16, .75); display: flex; align-items: center; justify-content: center; z-index: 35; }
#modal .box { background: var(--panel); border: 3px solid var(--accent); box-shadow: 6px 6px 0 #000; padding: 20px; min-width: 260px; max-width: calc(100vw - 32px); text-align: center; }
#modal h2 { color: var(--accent); margin: 0 0 14px; font-size: 18px; }
#modal p { font-size: 10px; line-height: 1.8; margin: 6px 0; }
#modal p.big { font-size: 20px; color: var(--good); }
#modal-btns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
#tip { position: absolute; z-index: 32; width: 220px; background: #0d0818; border: 3px solid var(--ink); padding: 10px; font-size: 8px; line-height: 1.6; box-shadow: 4px 4px 0 #000; }
#tip b { display: block; color: var(--accent); margin-bottom: 4px; }
#tip b.uncommon { color: var(--uncommon); }
#tip b.rare { color: var(--rare); }
#tip small { color: var(--muted); font-size: 7px; }
#tip p { margin: 6px 0; }
#tip button { font-size: 8px; margin-top: 6px; }

#crt { position: fixed; inset: 0; pointer-events: none; z-index: 40; display: none; }
body.crt #crt { display: block; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .6) 100%); box-shadow: inset 0 0 90px rgba(0, 0, 0, .7); border-radius: 24px; animation: flicker 4s infinite steps(1); }
body.crt #app { text-shadow: 1px 0 rgba(255, 0, 80, .35), -1px 0 rgba(0, 200, 255, .35); }
body.crt canvas#board { filter: saturate(1.2) contrast(1.08); }
@keyframes flicker { 0%, 100% { opacity: 1; } 47% { opacity: .92; } 48% { opacity: 1; } }

body.mobile #screen-game { grid-template-columns: 1fr; grid-template-areas: "hud" "board" "perks"; padding: 8px; gap: 8px; justify-items: center; }
body.mobile #hud { flex-direction: row; flex-wrap: wrap; gap: 8px 14px; padding: 8px; width: 100%; }
body.mobile .stat .v { font-size: 11px; }
body.mobile #bar { width: 80px; }
body.mobile #perk-row { width: 100%; }
body.mobile #shop { position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 55vh; z-index: 25; border-width: 3px 0 0; }
body.mobile #shop.collapsed { max-height: 48px; overflow: hidden; }
body.mobile #btn-shop-toggle { display: inline-block; }
@media (prefers-reduced-motion: reduce) { .logo, body.crt #crt { animation: none; } }
</style>
<div id="app">
  <section id="screen-title" class="screen">
    <h1 class="logo">GEM<br>FACTORY</h1>
    <p class="sub">A MATCH-3 ROGUELIKE</p>
    <button id="btn-new">NEW RUN</button>
    <button id="btn-continue" class="hidden">CONTINUE</button>
    <label class="seed">SEED <input id="seed-input" maxlength="16" placeholder="random"></label>
    <div class="toggles"><button id="btn-mute-t">SOUND: ON</button><button id="btn-crt-t">CRT: ON</button></div>
  </section>
  <section id="screen-game" class="screen hidden">
    <aside id="hud">
      <div class="stat"><label>ROUND</label><div class="v" id="hud-round">1/20</div></div>
      <div class="stat"><label>TARGET</label><div class="v" id="hud-target">800</div></div>
      <div class="stat"><label>SCORE</label><div class="v" id="hud-score">0</div><div id="bar"><div id="bar-fill"></div></div></div>
      <div class="stat"><label>MOVES</label><div class="v" id="hud-moves">20</div></div>
      <div class="stat"><label>MONEY</label><div class="v money" id="hud-money">$20</div></div>
      <div class="hud-btns"><button id="btn-speed">1x</button><button id="btn-mute">SND ON</button><button id="btn-crt">CRT ON</button></div>
    </aside>
    <main id="board-wrap"><div id="move-points"></div><canvas id="board"></canvas><div id="fx"></div></main>
    <section id="perk-row"></section>
    <aside id="shop" class="hidden">
      <h2>SHOP <button id="btn-shop-toggle">HIDE</button></h2>
      <h3>PERKS</h3><div id="shop-perks" class="cards"></div>
      <h3>POWER TILES</h3><div id="shop-tiles" class="cards"></div>
      <h3>UPGRADE</h3><div id="shop-upgrade" class="cards"></div>
      <div class="shop-actions"><button id="btn-reroll">REROLL $2</button><button id="btn-next">NEXT ROUND &gt;</button></div>
      <p id="shop-hint"></p>
    </aside>
  </section>
  <div id="modal" class="hidden"><div class="box"><h2 id="modal-title"></h2><div id="modal-body"></div><div id="modal-btns"></div></div></div>
  <div id="tip" class="hidden"></div>
  <div id="flash"></div><div id="big"></div><div id="toast"></div>
</div>
<div id="crt"></div>
<script>// ---- balance.js
(function (GF) {
  'use strict';
  let nextId = 1;
  const C = {
    SIZE: 8,
    COLORS: ['red', 'blue', 'green', 'yellow', 'purple', 'white', 'orange'],
    HOT: [0, 6, 3],
    COLD: [2, 1, 4],
    START_MONEY: 20,
    START_SLOTS: 5,
    MAX_SLOTS: 10,
    START_MOVES: 20,
    MAX_EXTRA_MOVES: 5,
    BASE_INCOME: 3,
    DEBT_FLOOR: -20,
    ROUNDS: 20,
    TARGET_START: 1000,
    TARGET_GROWTH: 1.45,
    ENDLESS_GROWTH: 1.5,
    PERK_PRICE: { common: 4, uncommon: 6, rare: 10 },
    RARITY_WEIGHTS: { common: 60, uncommon: 30, rare: 10 },
    REROLL_BASE: 2,
    UPGRADE_PRICE: { moves: 8, slot: 15, polish: 3 },
    POLISH_BONUS: 5,
    SAVE_KEY: 'gemfactory.save.v1',
  };
  C.base = function (round) { return 10 + 5 * (round - 1); };
  C.roundNice = function (n) {
    if (n < 100) return Math.round(n);
    const p = Math.pow(10, Math.floor(Math.log10(n)) - 1);
    return Math.round(n / p) * p;
  };
  C.gem = function (kind, color) {
    const colorless = kind === 'prism' || kind === 'wild' || kind === 'coal';
    return { id: nextId++, kind: kind, color: colorless ? null : color };
  };
  C.setNextId = function (n) { nextId = Math.max(nextId, n); };
  C.SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  C.fmt = function (n) {
    if (!isFinite(n)) return n < 0 ? '-∞' : '∞';
    const sign = n < 0 ? '-' : '';
    const a = Math.abs(n);
    if (a < 1000) return sign + Math.floor(a).toLocaleString('en-US');
    if (a < 1e36) {
      let tier = Math.floor(Math.log10(a) / 3);
      while (tier > 1 && a < Math.pow(1000, tier)) tier--;
      while (a >= Math.pow(1000, tier + 1)) tier++;
      let v = a / Math.pow(1000, tier);
      let s = v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
      if (Number(s) >= 1000) { tier++; v = a / Math.pow(1000, tier); s = v.toFixed(2); }
      if (tier < C.SUFFIXES.length) return sign + s + C.SUFFIXES[tier];
    }
    let e = Math.floor(Math.log10(a));
    let m = a / Math.pow(10, e);
    if (m >= 10) { m /= 10; e++; }
    if (m < 1) { m *= 10; e--; }
    let ms = m.toFixed(2);
    if (Number(ms) >= 10) { e++; ms = (m / 10).toFixed(2); }
    return sign + ms + 'e' + e;
  };
  GF.C = C;
})(typeof window !== 'undefined' ? (window.GF = window.GF || {}) : (globalThis.GF = globalThis.GF || {}));

// ---- rng.js
(function (GF) {
  'use strict';
  function RNG(seed) { this.s = (seed >>> 0) || 1; }
  RNG.prototype.next = function () {
    let t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  RNG.prototype.int = function (n) { return Math.floor(this.next() * n); };
  RNG.prototype.pick = function (arr) { return arr[this.int(arr.length)]; };
  RNG.prototype.chance = function (p) { return this.next() < p; };
  RNG.prototype.shuffle = function (arr) {
    for (let i = arr.length - 1; i > 0; i--) { const j = this.int(i + 1); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  };
  RNG.prototype.weighted = function (weights) {
    const keys = Object.keys(weights);
    let total = 0;
    for (const k of keys) total += weights[k];
    let roll = this.next() * total;
    for (const k of keys) { if (weights[k] <= 0) continue; roll -= weights[k]; if (roll < 0) return k; }
    return keys.filter((k) => weights[k] > 0).pop();
  };
  RNG.hash = function (str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };
  GF.RNG = RNG;
})(typeof window !== 'undefined' ? (window.GF = window.GF || {}) : (globalThis.GF = globalThis.GF || {}));

// ---- board.js
(function (GF) {
  'use strict';
  const C = GF.C;
  const N = C.SIZE;
  const grid = (v) => Array.from({ length: N }, () => Array(N).fill(v));
  const inB = (r, c) => r >= 0 && c >= 0 && r < N && c < N;
  const key = (r, c) => r * N + c;
  const clone = (g) => (g ? { id: g.id, kind: g.kind, color: g.color } : null);

  function create() { return { cells: grid(null), tiles: grid(null), tileState: grid(0) }; }

  function matchesColor(g, k) { return !!g && (g.kind === 'wild' || g.color === k); }

  function pushIfRun(board, run, k, dir, out) {
    if (run.length >= 3 && run.some(([r, c]) => board.cells[r][c].kind !== 'wild')) out.push({ color: k, dir: dir, cells: run });
  }

  function lineRuns(board, k, out) {
    for (let dir = 0; dir < 2; dir++) {
      for (let i = 0; i < N; i++) {
        let run = [];
        for (let j = 0; j < N; j++) {
          const r = dir === 0 ? i : j, c = dir === 0 ? j : i;
          if (matchesColor(board.cells[r][c], k)) { run.push([r, c]); continue; }
          pushIfRun(board, run, k, dir === 0 ? 'h' : 'v', out);
          run = [];
        }
        pushIfRun(board, run, k, dir === 0 ? 'h' : 'v', out);
      }
    }
  }

  function squareRuns(board, k, out) {
    for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) {
      const cells = [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]];
      if (cells.every(([a, b]) => matchesColor(board.cells[a][b], k)) &&
          cells.some(([a, b]) => board.cells[a][b].kind !== 'wild')) out.push({ color: k, dir: 'sq', cells: cells });
    }
  }

  function findGroups(board, opts, colors) {
    opts = opts || {};
    colors = colors || [0, 1, 2, 3, 4, 5, 6];
    const runs = [];
    for (const k of colors) { lineRuns(board, k, runs); if (opts.square) squareRuns(board, k, runs); }
    const parent = runs.map((_, i) => i);
    const find = (i) => (parent[i] === i ? i : (parent[i] = find(parent[i])));
    const sets = runs.map((r) => new Set(r.cells.map(([a, b]) => key(a, b))));
    for (let i = 0; i < runs.length; i++) for (let j = i + 1; j < runs.length; j++) {
      if (runs[i].color !== runs[j].color) continue;
      for (const x of sets[i]) if (sets[j].has(x)) { parent[find(i)] = find(j); break; }
    }
    const byRoot = new Map();
    runs.forEach((r, i) => { const root = find(i); if (!byRoot.has(root)) byRoot.set(root, []); byRoot.get(root).push(r); });
    const groups = [];
    for (const rs of byRoot.values()) {
      const cells = new Map();
      rs.forEach((r) => r.cells.forEach(([a, b]) => cells.set(key(a, b), [a, b])));
      const lines = rs.filter((r) => r.dir !== 'sq');
      const maxLen = lines.reduce((m, r) => Math.max(m, r.cells.length), 0);
      let shape = 'three';
      if (maxLen >= 6) shape = 'six';
      else if (maxLen >= 5) shape = 'five';
      else if (lines.some((r) => r.dir === 'h') && lines.some((r) => r.dir === 'v')) shape = 'shape';
      else if (maxLen === 4) shape = 'four';
      else if (rs.some((r) => r.dir === 'sq')) shape = 'square';
      groups.push({ color: rs[0].color, shape: shape, cells: Array.from(cells.values()), runs: rs });
    }
    return groups;
  }

  function adjacent(a, b) { return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1; }
  function swap(board, a, b) {
    const t = board.cells[a.r][a.c];
    board.cells[a.r][a.c] = board.cells[b.r][b.c];
    board.cells[b.r][b.c] = t;
  }
  function isPrismSwap(board, a, b) {
    const ga = board.cells[a.r][a.c], gb = board.cells[b.r][b.c];
    if (!ga || !gb) return false;
    return (ga.kind === 'prism' && gb.color != null) || (gb.kind === 'prism' && ga.color != null);
  }
  function canSwap(board, a, b, opts, colors) {
    if (!inB(a.r, a.c) || !inB(b.r, b.c) || !adjacent(a, b)) return false;
    if (!board.cells[a.r][a.c] || !board.cells[b.r][b.c]) return false;
    if (isPrismSwap(board, a, b)) return true;
    swap(board, a, b);
    const ok = findGroups(board, opts, colors).length > 0;
    swap(board, a, b);
    return ok;
  }
  function hasMoves(board, opts, colors) {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (c + 1 < N && canSwap(board, { r: r, c: c }, { r: r, c: c + 1 }, opts, colors)) return true;
      if (r + 1 < N && canSwap(board, { r: r, c: c }, { r: r + 1, c: c }, opts, colors)) return true;
    }
    return false;
  }
  function wouldMatch(board, r, c, k) {
    const m = (rr, cc) => inB(rr, cc) && matchesColor(board.cells[rr][cc], k);
    let h = 1; for (let x = c - 1; m(r, x); x--) h++; for (let x = c + 1; m(r, x); x++) h++;
    let v = 1; for (let y = r - 1; m(y, c); y--) v++; for (let y = r + 1; m(y, c); y++) v++;
    return h >= 3 || v >= 3;

      const d = GF.Perks.byId[id], pp = GF.Shop.perkPrice(run, id);
      const el = cardEl('card ' + d.rarity, '<div class="cn">' + d.name + '</div><div class="cd">' + d.desc + '</div><div class="cp">$' + pp + '</div>');
      if (!can(pp) || run.perks.length >= run.perkSlots) el.classList.add('off');
      el.onclick = () => act(GF.Shop.buyPerk(run, i));
      P.appendChild(el);
    });
    const T = $('shop-tiles'); T.innerHTML = '';
    s.tiles.forEach((id, i) => {
      if (!id) { T.appendChild(cardEl('card sold', '<div class="cn">SOLD</div>')); return; }
      const d = GF.Tiles.DEFS[id], tp = GF.Shop.tilePrice(run, id);
      const el = cardEl('card tile' + (S.placing === i ? ' picked' : ''),
        '<div class="cn" style="color:' + GF.Render.TILE_COL[id] + '">[' + d.icon + '] ' + d.name + '</div><div class="cd">' + d.desc + '</div><div class="cp">$' + tp + '</div>');
      if (!can(tp)) el.classList.add('off');
      el.onclick = () => {
        if (!can(tp)) { act({ ok: false, reason: 'money' }); return; }
        S.placing = S.placing === i ? null : i;
        if (document.body.classList.contains('mobile')) $('shop').classList.toggle('collapsed', S.placing != null);
        renderShop();
      };
      T.appendChild(el);
    });
    const U = $('shop-upgrade'); U.innerHTML = '';
    const up = s.upgrade;
    if (!up) U.appendChild(cardEl('card sold', '<div class="cn">SOLD</div>'));
    else {
      const label = up.type === 'moves' ? '+1 MOVE / ROUND' : up.type === 'slot' ? '+1 PERK SLOT' : 'POLISH ' + C.COLORS[up.color].toUpperCase();
      const desc = up.type === 'moves' ? 'Start every round with one more move.' : up.type === 'slot' ? 'Hold one more perk.' : '+5 points for every ' + C.COLORS[up.color] + ' gem. Stacks.';
      const upp = GF.Shop.upgradePrice(run, up);
      const el = cardEl('card upgrade', '<div class="cn">' + label + '</div><div class="cd">' + desc + '</div><div class="cp">$' + upp + '</div>');
      if (!can(upp)) el.classList.add('off');
      el.onclick = () => act(GF.Shop.buyUpgrade(run));
      U.appendChild(el);
    }
    const rp = GF.Shop.rerollPrice(run);
    $('btn-reroll').textContent = rp === 0 ? 'REROLL FREE' : 'REROLL $' + rp;
    $('btn-reroll').disabled = !can(rp);
    $('shop-hint').textContent = S.placing != null && s.tiles[S.placing]
      ? 'Tap a board cell to place the ' + GF.Tiles.DEFS[s.tiles[S.placing]].name + '. ESC to cancel.'
      : 'Tap a perk to see or sell it. Drag perks to reorder. Long-press or right-click a cell for info.';
  }
  function refresh() {
    refreshHud();
    if (!S.run) return;
    if (!S.busy) renderPerks();
    if (S.run.phase === 'shop') renderShop();
  }
  function act(r) {
    if (r && r.ok) { GF.Audio.ching(); GF.Run.save(S.run); }
    else {
      GF.Audio.bad();
      toast(r && r.reason === 'slots' ? 'NO FREE PERK SLOT' : r && r.reason === 'money' ? 'NOT ENOUGH MONEY' : r && r.reason === 'debt' ? 'PAY OFF DEBT FIRST' : 'CANNOT DO THAT');
    }
    refresh();
  }

  // ---------- tips & modal ----------
  function showTip(rect, html, btns) {
    const tip = $('tip');
    tip.innerHTML = html;
    tip.classList.remove('hidden');
    (btns || []).forEach(([label, fn]) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = (e) => { e.stopPropagation(); hideTip(); fn(); };
      tip.appendChild(b);
    });
    const a = $('app').getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    const x = rect.left - a.left + rect.width / 2 - w / 2;
    let y = rect.top - a.top - h - 8;
    if (y < 8) y = rect.bottom - a.top + 8;
    tip.style.left = Math.max(8, Math.min(a.width - w - 8, x)) + 'px';
    tip.style.top = Math.max(8, y) + 'px';
  }
  function hideTip() { $('tip').classList.add('hidden'); }
  function showPerkTip(el, i) {
    const inst = S.run.perks[i];
    if (!inst) return;
    const d = GF.Perks.byId[inst.id];
    const btns = [];
    if (!S.busy) {
      const mv = (to) => () => { hideTip(); if (GF.Shop.movePerk(S.run, i, to)) { if (S.run.phase === 'shop') GF.Run.save(S.run); refresh(); } };
      if (i > 0) btns.push(['< MOVE', mv(i - 1)]);
      if (i < S.run.perks.length - 1) btns.push(['MOVE >', mv(i + 1)]);
      if (S.run.phase === 'shop') btns.push(['SELL ' + money(GF.Perks.sellValue(inst, S.run.perks)), () => act(GF.Shop.sellPerk(S.run, inst.uid))]);
    }
    showTip(el.getBoundingClientRect(), '<b class="' + d.rarity + '">' + d.name + '</b><small>' + d.rarity.toUpperCase() + '</small><p>' + perkDesc(d, inst) + '</p>', btns);
  }
  function showCellTip(cell) {
    const run = S.run, g = run.board.cells[cell.r][cell.c], tile = run.board.tiles[cell.r][cell.c];
    let html = '';
    if (g) html += '<b>' + (g.kind === 'normal' ? C.COLORS[g.color].toUpperCase() + ' GEM' : g.kind.toUpperCase()) + '</b><p>' + GEM_INFO[g.kind] + '</p>';
    if (tile) {
      const d = GF.Tiles.DEFS[tile];
      html += '<b>' + d.name.toUpperCase() + '</b><p>' + d.desc + (d.period ? ' (' + (d.period - run.board.tileState[cell.r][cell.c]) + ' moves left)' : '') + '</p>';
    }
    const btns = tile && run.phase === 'shop' ? [['REMOVE TILE', () => { GF.Shop.removeTile(run, cell.r, cell.c); GF.Run.save(run); refresh(); }]] : [];
    if (html) showTip(GF.Render.cellRect(cell.r, cell.c), html, btns);
  }
  function modal(title, html, buttons) {
    return new Promise((resolve) => {
      $('modal-title').textContent = title;
      $('modal-body').innerHTML = html;
      const B = $('modal-btns');
      B.innerHTML = '';
      buttons.forEach(([label, val]) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.onclick = () => { $('modal').classList.add('hidden'); resolve(val); };
        B.appendChild(b);
      });
      $('modal').classList.remove('hidden');
    });
  }

  // ---------- input ----------
  function bindPerkCard(el, i) {
    el.addEventListener('pointerdown', (e) => {
      if (S.busy) return;
      e.preventDefault();
      const sx = e.clientX, sy = e.clientY;
      let dragging = false;
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      const move = (ev) => { if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) { dragging = true; el.classList.add('dragging'); } };
      const cleanup = () => {
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', cancel);
        el.classList.remove('dragging');
      };
      const cancel = () => cleanup();
      const up = (ev) => {
        cleanup();
        if (!dragging) { showPerkTip(el, i); return; }
        const target = document.elementFromPoint(ev.clientX, ev.clientY);
        const card = target && target.closest('.perk[data-i]');
        if (card && GF.Shop.movePerk(S.run, i, +card.dataset.i)) { if (S.run.phase === 'shop') GF.Run.save(S.run); refresh(); }
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', cancel);
    });
  }
  async function placeTile(cell) {
    const run = S.run, idx = S.placing;
    const existing = run.board.tiles[cell.r][cell.c];
    if (existing) {
      const ok = await modal('REPLACE TILE?', '<p>This cell already has a ' + GF.Tiles.DEFS[existing].name + '.</p>', [['REPLACE', true], ['CANCEL', false]]);
      if (!ok) return;
    }
    S.placing = null;
    $('shop').classList.remove('collapsed');
    act(GF.Shop.buyTile(run, idx, cell.r, cell.c));
    GF.Render.pulseTile(cell.r, cell.c);
  }
  function bindBoard() {
    const cv = $('board');
    let down = null, lp = null;
    const clearLp = () => { if (lp) { clearTimeout(lp); lp = null; } };
    cv.addEventListener('pointerdown', (e) => {
      const run = S.run;
      if (!run || S.busy) return;
      const cell = GF.Render.cellAt(e.clientX, e.clientY);
      if (!cell) return;
      e.preventDefault();
      if (S.placing != null) { placeTile(cell); return; }
      if (run.phase !== 'play') { showCellTip(cell); return; }
      down = { cell: cell, x: e.clientX, y: e.clientY };
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      clearLp();
      lp = setTimeout(() => { if (down) { showCellTip(down.cell); down = null; } }, 500);
    });
    cv.addEventListener('pointermove', (e) => {
      if (!down || S.busy) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < GF.Render.cellPx() * 0.4) return;
      clearLp();
      const a = down.cell;
      const b = Math.abs(dx) > Math.abs(dy) ? { r: a.r, c: a.c + Math.sign(dx) } : { r: a.r + Math.sign(dy), c: a.c };
      down = null;
      trySwap(a, b);
    });
    cv.addEventListener('pointerup', () => {
      clearLp();
      if (!down) return;
      const cell = down.cell, sel = S.selected;
      down = null;
      if (sel && Math.abs(sel.r - cell.r) + Math.abs(sel.c - cell.c) === 1) trySwap(sel, cell);
      else S.selected = sel && sel.r === cell.r && sel.c === cell.c ? null : cell;
    });
    cv.addEventListener('pointercancel', () => { clearLp(); down = null; });
    cv.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const cell = GF.Render.cellAt(e.clientX, e.clientY);
      if (cell && S.run) showCellTip(cell);
    });
  }

  // ---------- flow ----------
  function layout() {
    const w = window.innerWidth, h = window.innerHeight, mobile = w < 760;
    document.body.classList.toggle('mobile', mobile);
    const shopOpen = S.run && S.run.phase === 'shop';
    const availW = mobile ? w - 24 : w - 220 - (shopOpen ? 320 : 0) - 64;
    const availH = mobile ? h - 330 : h - 190;
    GF.Render.resize(Math.max(28, Math.min(72, Math.floor(Math.min(availW, availH) / 8))));
  }
  function toTitle() {
    S.run = null; S.busy = false; S.placing = null; S.selected = null;
    show('screen-title');
    $('btn-continue').classList.toggle('hidden', !GF.Run.hasSave());
  }
  function newRun() {
    const txt = $('seed-input').value.trim();
    const seed = txt ? (/^\d+$/.test(txt) ? +txt : GF.RNG.hash(txt)) : undefined;
    S.run = GF.Run.create(seed);
    show('screen-game');
    GF.Anim.sync(S.run.board);
    enterShop();
  }
  function resume(run) {
    S.run = run;
    show('screen-game');
    GF.Anim.sync(run.board);
    if (run.phase === 'shop') enterShop();
    else if (run.phase === 'victory') { layout(); refresh(); victory(); }
    else { run.phase = 'play'; $('shop').classList.add('hidden'); layout(); refresh(); }
  }
  function enterShop() {
    const run = S.run;
    if (!run.shop) GF.Shop.open(run);
    run.phase = 'shop';
    $('shop').classList.remove('hidden', 'collapsed');
    $('toast').classList.remove('on'); $('big').classList.remove('on');
    GF.Run.save(run);
    layout(); refresh();
  }
  function startRound() {
    if (S.busy || !S.run || S.run.phase !== 'shop') return;
    const run = S.run;
    S.placing = null; run.shop = null; hideTip();
    $('shop').classList.add('hidden');
    const events = GF.Run.startRound(run);
    GF.Anim.sync(run.board);
    GF.Run.save(run);
    layout(); refresh();
    toast('ROUND ' + run.round);
    events.forEach((e, i) => setTimeout(() => {
      hooks.float(e.r, e.c, String(e.gem.kind).toUpperCase(), 'money');
      GF.Render.pulseTile(e.r, e.c);
    }, 300 + i * 150));
  }
  async function trySwap(a, b) {
    const run = S.run;
    if (S.busy || !run || run.phase !== 'play') return;
    S.selected = null;
    const before = run.score;
    const res = GF.Run.doMove(run, a, b);
    if (!res) { GF.Audio.bad(); GF.Anim.bump(a, b); return; }
    S.busy = true;
    S.shownScore = before;
    refreshHud();
    try { await GF.Anim.play(res.timeline, hooks); } catch (e) { console.error(e); }
    if (res.insured) toast('INSURANCE!');
    GF.Anim.sync(run.board);
    S.busy = false;
    refresh();
    if (run.phase === 'won') await roundWon();
    else if (run.phase === 'over') await gameOver();
  }
  async function roundWon() {
    const run = S.run;
    GF.Audio.win();
    const info = GF.Run.finishRound(run);
    info.steps.forEach((s) => hooks.perkFire(s));
    refresh();
    await modal('ROUND CLEAR!', '<p>Base income <b>$' + info.base + '</b></p><p>Leftover moves <b>' + info.leftover + ' x $1</b></p>' + (info.perkIncome ? '<p>Perks <b>' + (info.perkIncome >= 0 ? '+$' : '-$') + Math.abs(info.perkIncome) + '</b></p>' : '') + '<p class="big">+$' + info.income + '</p>', [['CONTINUE', true]]);
    if (run.phase === 'victory') { GF.Run.save(run); await victory(); } else enterShop();
  }
  async function victory() {
    const run = S.run;
    const v = await modal('VICTORY!', '<p>You beat all ' + C.ROUNDS + ' rounds.</p><p>Best move <b>' + fmt(run.stats.bestMove) + '</b></p><p>Seed <b>' + run.seed + '</b></p>', [['ENDLESS', 'endless'], ['MENU', 'menu']]);
    if (v === 'endless') { GF.Run.continueEndless(run); enterShop(); } else { GF.Run.clearSave(); toTitle(); }
  }
  async function gameOver() {
    const run = S.run;
    GF.Audio.lose();
    GF.Run.clearSave();
    await modal('GAME OVER', '<p>Reached round <b>' + run.round + '</b>' + (run.endless ? ' (endless)' : '') + '</p><p>Score <b>' + fmt(run.score) + ' / ' + fmt(GF.Run.target(run.round)) + '</b></p><p>Best move <b>' + fmt(run.stats.bestMove) + '</b></p><p>Seed <b>' + run.seed + '</b></p>', [['MENU', true]]);
    toTitle();
  }
  function updateToggles() {
    const m = GF.Audio.isMuted();
    $('btn-mute').textContent = m ? 'SND OFF' : 'SND ON';
    $('btn-mute-t').textContent = 'SOUND: ' + (m ? 'OFF' : 'ON');
    $('btn-crt').textContent = S.crt ? 'CRT ON' : 'CRT OFF';
    $('btn-crt-t').textContent = 'CRT: ' + (S.crt ? 'ON' : 'OFF');
    document.body.classList.toggle('crt', S.crt);
    $('btn-speed').textContent = SPEEDS[S.speedIdx] + 'x';
  }
  function loop(now) {
    GF.Anim.update(now);
    if (S.run) GF.Render.frame({ display: GF.Anim.display, board: S.run.board, selected: S.selected, placing: S.placing != null, time: now });
    requestAnimationFrame(loop);
  }
  function findMove() {
    const run = S.run;
    if (!run) return null;
    const f = GF.Perks.flags(run.perks), cols = GF.Run.colors(run);
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      if (c < 7 && GF.Board.canSwap(run.board, { r: r, c: c }, { r: r, c: c + 1 }, f, cols)) return { a: { r: r, c: c }, b: { r: r, c: c + 1 } };
      if (r < 7 && GF.Board.canSwap(run.board, { r: r, c: c }, { r: r + 1, c: c }, f, cols)) return { a: { r: r, c: c }, b: { r: r + 1, c: c } };
    }
    return null;
  }
  function state() {
    const r = S.run;
    return r ? { phase: r.phase, busy: S.busy, movesLeft: r.movesLeft, score: r.score, round: r.round, money: r.money } : { phase: 'title', busy: S.busy };
  }
  function init() {
    GF.Render.init($('board'));
    S.crt = prefGet('crt') !== '0';
    S.speedIdx = (+(prefGet('speed') || 0)) % 3;
    GF.Anim.speed = SPEEDS[S.speedIdx];
    updateToggles();
    $('btn-new').onclick = () => { GF.Audio.unlock(); newRun(); };
    $('btn-continue').onclick = () => { GF.Audio.unlock(); const r = GF.Run.load(); if (r) resume(r); else toTitle(); };
    [$('btn-mute'), $('btn-mute-t')].forEach((b) => { b.onclick = () => { GF.Audio.setMuted(!GF.Audio.isMuted()); updateToggles(); }; });
    [$('btn-crt'), $('btn-crt-t')].forEach((b) => { b.onclick = () => { S.crt = !S.crt; prefSet('crt', S.crt ? '1' : '0'); updateToggles(); }; });
    $('btn-speed').onclick = () => { S.speedIdx = (S.speedIdx + 1) % 3; GF.Anim.speed = SPEEDS[S.speedIdx]; prefSet('speed', String(S.speedIdx)); updateToggles(); };
    $('btn-reroll').onclick = () => { S.placing = null; $('shop').classList.remove('collapsed'); act(GF.Shop.reroll(S.run)); };
    $('btn-next').onclick = () => startRound();
    $('btn-shop-toggle').onclick = () => $('shop').classList.toggle('collapsed');
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { S.placing = null; hideTip(); $('shop').classList.remove('collapsed'); renderShop(); } });
    document.addEventListener('pointerdown', (e) => { if (!$('tip').contains(e.target)) hideTip(); }, true);
    bindBoard();
    window.addEventListener('resize', layout);
    layout();
    toTitle();
    requestAnimationFrame(loop);
  }

  GF.UI = { init: init, state: state, findMove: findMove, trySwap: trySwap, debugRun: () => S.run };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})(typeof window !== 'undefined' ? (window.GF = window.GF || {}) : (globalThis.GF = globalThis.GF || {}));
</script>

</body>
</html>
