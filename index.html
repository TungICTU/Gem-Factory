<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
</head>
<body>
<title>Gem Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>:root {
  --bg: #120b1f; --panel: #1e1433; --panel2: #2a1d47; --ink: #f5efff; --muted: #a99cc7;
  --accent: #ffd23f; --good: #3ddc84; --bad: #ff4d6d;
  --common: #9ad1ff; --uncommon: #3ddc84; --rare: #ff6bd6;
  color-scheme: dark; /* single deliberate dark arcade look */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Press Start 2P', ui-monospace, monospace; font-size: 12px; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.hidden { display: none !important; }
button { font: inherit; font-size: 10px; color: var(--ink); background: var(--panel2); border: 3px solid var(--ink); padding: 8px 10px; cursor: pointer; box-shadow: 3px 3px 0 #000; }
button:hover:not(:disabled) { background: #3a2a63; }
button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
button:disabled { opacity: .4; cursor: not-allowed; }
input { font: inherit; font-size: 10px; background: #000; color: var(--ink); border: 3px solid var(--ink); padding: 6px; width: 150px; }

#screen-title { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 16px; }
.logo { font-size: clamp(28px, 8vw, 56px); line-height: 1.2; margin: 0 0 8px; color: var(--accent); text-shadow: 4px 4px 0 var(--bad), 8px 8px 0 #3a86ff; animation: bob 2s steps(4) infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.sub { color: var(--muted); font-size: 10px; margin: 0 0 12px; }
.seed { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

#screen-game { display: grid; grid-template-columns: 220px auto auto; grid-template-areas: "hud perks shop" "hud board shop"; gap: 12px 16px; padding: 12px; align-items: start; max-width: 100vw; max-height: 100%; }
#left-col { grid-area: hud; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
#hud { background: var(--panel); border: 3px solid var(--ink); padding: 12px; display: flex; flex-direction: column; gap: 14px; box-shadow: 4px 4px 0 #000; }
.stat label { display: block; color: var(--muted); font-size: 8px; margin-bottom: 6px; }
.stat .v { font-size: 15px; }
.money { color: var(--accent); }
.money.neg { color: var(--bad); }
#bar { height: 12px; border: 2px solid var(--ink); background: #000; margin-top: 6px; }
#bar-fill { height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--good) 0 6px, #2fb36b 6px 12px); transition: width .25s steps(6); }
.hud-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.hud-btns button { font-size: 8px; padding: 6px; }
#board-wrap { grid-area: board; position: relative; padding-top: 30px; width: max-content; }
canvas#board { display: block; image-rendering: pixelated; border: 3px solid var(--ink); box-shadow: 4px 4px 0 #000; background: #24183c; touch-action: none; }
#move-points { position: absolute; left: 50%; top: 0; transform: translateX(-50%) scale(var(--mp-scale, 1)); font-size: 18px; color: var(--accent); text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; pointer-events: none; white-space: nowrap; transition: transform .12s; z-index: 5; }
#move-points.fly { animation: fly .32s ease-in forwards; }
@keyframes fly { to { transform: translate(-50%, -30px) scale(1.6); opacity: 0; } }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 6; }

#shop { grid-area: shop; width: 300px; background: var(--panel); border: 3px solid var(--accent); padding: 12px; box-shadow: 4px 4px 0 #000; max-height: calc(100dvh - 24px); overflow-y: auto; }
#shop h2 { margin: 0 0 10px; font-size: 16px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
#btn-shop-toggle { display: none; font-size: 8px; padding: 4px 6px; }
#shop h3 { margin: 10px 0 6px; font-size: 8px; color: var(--muted); }
.cards { display: flex; gap: 6px; flex-wrap: wrap; }
.card { width: 88px; min-height: 112px; background: var(--panel2); border: 3px solid var(--common); padding: 6px; font-size: 7px; line-height: 1.5; cursor: pointer; box-shadow: 3px 3px 0 #000; display: flex; flex-direction: column; gap: 4px; }
.card.uncommon { border-color: var(--uncommon); }
.card.rare { border-color: var(--rare); }
.card.tile, .card.upgrade { border-color: var(--accent); }
.card .cn { font-size: 8px; color: var(--accent); line-height: 1.3; }
.card .cd { flex: 1; }
.card .cp { font-size: 10px; color: var(--good); }
.card.off { opacity: .45; }
.card.sold { opacity: .25; cursor: default; align-items: center; justify-content: center; }
.card.picked { outline: 3px dashed var(--accent); outline-offset: 2px; }
.card:hover:not(.sold) { transform: translateY(-3px); }
#btn-next { background: #1f6b43; }
#btn-next:hover:not(:disabled) { filter: brightness(1.25); }
#shop-hint { font-size: 7px; line-height: 1.6; color: var(--muted); margin: 10px 0 0; }

.float { position: absolute; transform: translate(-50%, -50%); pointer-events: none; font-size: 10px; color: #fff; text-shadow: 2px 2px 0 #000; animation: floatUp .8s ease-out forwards; white-space: nowrap; z-index: 20; }
.float.mul { color: var(--bad); font-size: 16px; }
.float.money { color: var(--accent); }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(-50%, -250%); } }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 30; }
#flash.on { animation: flash .25s; }
@keyframes flash { from { opacity: .5; } to { opacity: 0; } }
#big, #toast { position: fixed; left: 50%; pointer-events: none; opacity: 0; z-index: 31; white-space: nowrap; text-shadow: 4px 4px 0 #000; }
#big { top: 40%; font-size: 48px; color: var(--bad); }
#toast { top: 18%; font-size: 16px; color: var(--accent); }
#board-banner { position: absolute; left: 50%; top: calc(var(--board-h, 400px) / 2); pointer-events: none; opacity: 0; z-index: 31; white-space: nowrap; font-size: 28px; color: var(--accent); text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
#big.on, #toast.on, #board-banner.on { animation: pop .7s; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.25); } 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }
#modal { position: fixed; inset: 0; background: rgba(8, 4, 16, .75); display: flex; align-items: center; justify-content: center; z-index: 35; }
#modal .box { background: var(--panel); border: 3px solid var(--accent); box-shadow: 6px 6px 0 #000; padding: 20px; min-width: 260px; max-width: calc(100vw - 32px); text-align: center; }
#modal h2 { color: var(--accent); margin: 0 0 14px; font-size: 18px; }
#modal p { font-size: 10px; line-height: 1.8; margin: 6px 0; }
#modal p.big { font-size: 20px; color: var(--good); }
#modal .payout { min-width: 300px; text-align: left; font-size: 10px; line-height: 2; }
.payout .row { display: flex; gap: 6px; align-items: baseline; margin: 6px 0; }
.payout .row i { flex: 1; border-bottom: 2px dotted #4a3b70; }
.payout .row b { color: var(--accent); }
#modal-btns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
#tip { position: absolute; z-index: 36; width: 220px; background: #0d0818; border: 3px solid var(--ink); padding: 10px; font-size: 8px; line-height: 1.6; box-shadow: 4px 4px 0 #000; }
#tip b { display: block; color: var(--accent); margin-bottom: 4px; }
#tip b.uncommon { color: var(--uncommon); }
#tip b.rare { color: var(--rare); }
#tip small { color: var(--muted); font-size: 7px; }
#tip p { margin: 6px 0; }
#tip button { font-size: 8px; margin-top: 6px; }

#crt { position: fixed; inset: 0; pointer-events: none; z-index: 40; display: none; }
body.crt #crt { display: block; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .6) 100%); box-shadow: inset 0 0 90px rgba(0, 0, 0, .7); border-radius: 24px; animation: flicker 4s infinite steps(1); }
body.crt #app { text-shadow: 1px 0 rgba(255, 0, 80, .35), -1px 0 rgba(0, 200, 255, .35); }
body.crt canvas#board { filter: saturate(1.2) contrast(1.08); }
@keyframes flicker { 0%, 100% { opacity: 1; } 47% { opacity: .92; } 48% { opacity: 1; } }

body.mobile #screen-game { grid-template-columns: 1fr; grid-template-areas: "hud" "perks" "cp" "board"; padding: 8px; gap: 8px; justify-items: center; }
body.mobile #left-col { display: contents; }
body.mobile #hud { grid-area: hud; flex-direction: row; flex-wrap: wrap; gap: 8px 14px; padding: 8px; width: 100%; }
body.mobile .stat .v { font-size: 11px; }
body.mobile #bar { width: 80px; }
body.mobile #perk-frame { width: 100%; }
body.mobile #shop { position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 55vh; z-index: 25; border-width: 3px 0 0; }
body.mobile #shop.collapsed { max-height: 48px; overflow: hidden; }
body.mobile #btn-shop-toggle { display: inline-block; }
@media (prefers-reduced-motion: reduce) { .logo, body.crt #crt { animation: none; } }

#moves-bar { position: relative; height: 22px; margin-top: 8px; border: 3px solid var(--ink); background: #000; box-shadow: 4px 4px 0 #000; }
#moves-cells { position: absolute; inset: 2px; display: flex; gap: 2px; }
#moves-cells.tight { gap: 0; }
.mcell { flex: 1; background: #1b1430; }
.mcell.on { background: var(--good); }
#moves-bar.warn .mcell.on { background: var(--accent); }
#moves-bar.danger .mcell.on { background: var(--bad); animation: blink .6s steps(2) infinite; }
.mcell.new { animation: newcell .6s; }
@keyframes blink { 50% { filter: brightness(1.6); } }
@keyframes newcell { from { background: #fff; } }
#moves-text { display: inline-block; background: rgba(0,0,0,.65); padding: 2px 6px; }
#moves-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; pointer-events: none; }
.icon { width: 32px; height: 32px; image-rendering: pixelated; display: block; margin: 0 auto 4px; }
#card-tray { display: flex; gap: 6px; flex-wrap: wrap; justify-content: space-evenly; min-height: 54px; }
.card-slot { width: 44px; height: 54px; border: 2px dashed #4a3b70; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.card-slot .icon { margin: 0; }
.card-slot.full { border: 2px solid var(--uncommon); background: var(--panel2); }
.card-slot.targeting { outline: 3px dashed var(--accent); }
.card .tag { font-size: 6px; color: var(--muted); letter-spacing: 1px; }
.card .badge { font-size: 8px; color: var(--accent); }
#pending { margin-top: 10px; font-size: 8px; color: var(--accent); }
#pack-modal { position: fixed; inset: 0; background: rgba(8, 4, 16, .8); display: flex; align-items: center; justify-content: center; z-index: 34; }
#pack-modal .box { background: var(--panel); border: 3px solid var(--accent); box-shadow: 6px 6px 0 #000; padding: 18px; max-width: calc(100vw - 32px); max-height: calc(100vh - 24px); overflow-y: auto; text-align: center; }
#pack-modal h2 { color: var(--accent); font-size: 16px; margin: 0 0 8px; }
#pack-modal p { font-size: 9px; margin: 0 0 12px; }
#pack-modal .cards { justify-content: center; }
#pack-tray { margin-top: 12px; font-size: 8px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.pack-btns { margin-top: 14px; }

#perk-frame { grid-area: perks; position: relative; border: 3px solid var(--ink); background: var(--panel); box-shadow: 4px 4px 0 #000; padding: 10px 10px 22px; min-height: 92px; }
#perk-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-evenly; min-height: 56px; }
.frame-count { position: absolute; left: 8px; bottom: 5px; font-size: 8px; color: var(--muted); }
.perk { width: 56px; height: 56px; padding: 4px; display: flex; align-items: center; justify-content: center; background: var(--panel2); border: 3px solid var(--common); animation: float 3s ease-in-out infinite; cursor: grab; touch-action: none; position: relative; box-shadow: 3px 3px 0 #000; }
.perk .icon { width: 40px; height: 40px; margin: 0; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .perk, .card-slot, .slot, .pack { animation: none !important; } }
#tray-frame { position: relative; border: 2px solid var(--ink); padding: 6px 6px 18px; }
.card-slot { animation: float 3.4s ease-in-out infinite; }
#board-col { position: relative; }
#cascade-panel { display: flex; flex-direction: column; gap: 4px; align-items: center; padding: 12px 4px 4px; border: 0; background: none; opacity: 0; pointer-events: none; }
#cascade-panel.show { opacity: 1; }
#cascade-panel.fade { transition: opacity .6s; opacity: 0; }
#cp-cascades { color: var(--bad); }
#cp-gems { color: #3a86ff; }
#cascade-panel label { font-size: 7px; color: var(--muted); }
#cascade-panel div { font-size: 24px; margin-bottom: 8px; }
#cascade-panel .bump { animation: bumpn .3s; }
@keyframes bumpn { 50% { transform: scale(1.4); } }
body.mobile #cascade-panel { grid-area: cp; width: 100%; flex-direction: row; justify-content: space-around; align-items: baseline; padding: 4px; border: 0; background: none; box-shadow: none; }
body.mobile #cascade-panel div { margin: 0; font-size: 12px; }
.slots { display: flex; gap: 8px; flex-wrap: wrap; }
.slot { width: 56px; text-align: center; cursor: pointer; animation: float 3.2s ease-in-out infinite; }
.slot .frame { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: var(--panel2); border: 3px solid var(--common); box-shadow: 3px 3px 0 #000; }
.slot .frame .icon { width: 40px; height: 40px; margin: 0; }
.slot .price { font-size: 8px; color: var(--good); margin-top: 4px; }
.slot.off { opacity: .45; }
.slot.sold { opacity: .25; cursor: default; animation: none; }
.slot.uncommon .frame { border-color: var(--uncommon); } .slot.rare .frame { border-color: var(--rare); }
.slot.tile .frame, .slot.upgrade .frame { border-color: var(--accent); }
.pack { width: 56px; cursor: pointer; text-align: center; animation: float 3.2s ease-in-out infinite; }
.pack .frame { position: relative; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: var(--panel2); border: 3px solid; box-shadow: 3px 3px 0 #000; padding: 4px; }
.pack .frame .icon { width: 40px; height: 40px; margin: 0; }
.size { position: absolute; top: -7px; right: -7px; min-width: 18px; padding: 3px 3px 2px; font-size: 7px; line-height: 1; text-align: center; color: #000; border: 2px solid #000; box-shadow: 1px 1px 0 #000; }
.size.s-S { background: #3ddc84; } .size.s-M { background: #3a86ff; color: #fff; } .size.s-L { background: #d16bff; } .size.s-XL { background: #ff4d6d; }
.iconwrap { position: relative; display: block; width: fit-content; margin: 0 auto 4px; }
.iconwrap .icon { margin: 0; }
.slot .frame .iconwrap, .choice .frame .iconwrap { margin: 0; }
.iconwrap .plus { position: absolute; right: -6px; bottom: -6px; padding: 2px 3px 1px; font-size: 7px; line-height: 1; color: #000; background: var(--accent); border: 2px solid #000; }
.pack.t-tile .frame { border-color: #3a86ff; } .pack.t-jewel .frame { border-color: #ff6bd6; }
.pack.t-enhance .frame { border-color: #ff4d6d; } .pack.t-upgrade .frame { border-color: #ffd23f; }
.pack .price { font-size: 8px; color: var(--good); margin-top: 4px; }
.pack.off { opacity: .45; } .pack.sold { opacity: .25; cursor: default; animation: none; }
.shop-pair { display: flex; gap: 16px; margin: 12px 0; flex-wrap: wrap; justify-content: space-evenly; }
.shop-box { background: rgba(0,0,0,.25); border: 2px solid #4a3b70; padding: 8px; }
.shop-box h3 { margin-top: 0; }
.shop-box .slots { justify-content: center; }
button.wide { width: 100%; margin-top: 8px; }
.choice { width: 84px; cursor: pointer; text-align: center; font-size: 7px; }
.choice .frame { height: 64px; display: flex; align-items: center; justify-content: center; background: var(--panel2); border: 3px solid var(--common); box-shadow: 3px 3px 0 #000; margin-bottom: 4px; }
.choice .frame .icon { width: 44px; height: 44px; margin: 0; }
.choice.sold { opacity: .25; cursor: default; }
.choice.off { opacity: .45; }
.choice.uncommon .frame { border-color: var(--uncommon); } .choice.rare .frame { border-color: var(--rare); }
.choice.tile .frame, .choice.upgrade .frame { border-color: var(--accent); }
#hover-label { position: absolute; z-index: 37; pointer-events: none; background: #0d0818; border: 2px solid var(--ink); padding: 4px 6px; font-size: 8px; color: var(--accent); white-space: nowrap; }
.perk.uncommon { border-color: var(--uncommon); }
.perk.rare { border-color: var(--rare); }
.perk .inner { display: flex; align-items: center; justify-content: center; }
.perk .inner.shake { animation: shake .3s linear; }
@keyframes shake { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
#btn-hint { display: block; margin: 8px 0 0 auto; font-size: 8px; padding: 5px 10px; color: var(--accent); border-color: var(--accent); }
.perk.dragging { cursor: grabbing; box-shadow: 0 12px 16px rgba(0,0,0,.65); pointer-events: none; }
#shop-items { justify-content: space-evenly; }
</style>
<div id="app">
  <section id="screen-title" class="screen">
    <h1 class="logo">GEM<br>FACTORY</h1>
    <p class="sub">A MATCH-3 ROGUELIKE</p>
    <button id="btn-new">NEW RUN</button>
    <button id="btn-continue" class="hidden">CONTINUE</button>
    <label class="seed">SEED <input id="seed-input" maxlength="16" placeholder="random"></label>
    <div class="toggles"><button id="btn-mute-t">SOUND: ON</button><button id="btn-crt-t">CRT: ON</button></div>
  </section>
  <section id="screen-game" class="screen hidden">
    <div id="left-col">
    <aside id="hud">
      <div class="stat"><label>ROUND</label><div class="v" id="hud-round">1/20</div></div>
      <div class="stat"><label>TARGET</label><div class="v" id="hud-target">1,000</div></div>
      <div class="stat"><label>SCORE</label><div class="v" id="hud-score">0</div><div id="bar"><div id="bar-fill"></div></div></div>
      <div class="stat"><label>MONEY</label><div class="v money" id="hud-money">$10</div></div>
      <div class="stat"><label>CARDS</label><div id="tray-frame"><div id="card-tray"></div><span id="tray-count" class="frame-count">0/2</span></div></div>
      <div class="hud-btns"><button id="btn-speed">1x</button><button id="btn-mute">SND ON</button><button id="btn-crt">CRT ON</button></div>
    </aside>
    <aside id="cascade-panel"><label>CASCADES</label><div id="cp-cascades">0</div><label>GEMS</label><div id="cp-gems">0</div></aside>
    </div>
    <section id="perk-frame"><div id="perk-row"></div><span id="perk-count" class="frame-count">0/5</span></section>
    <main id="board-wrap">
      <div id="move-points"></div>
      <div id="board-col"><canvas id="board"></canvas><div id="fx"></div><div id="board-banner"></div>
        <div id="moves-bar"><div id="moves-cells"></div><span id="moves-label"><span id="moves-text">MOVES LEFT: 20</span></span></div>
        <button id="btn-hint" disabled>HINT</button>
      </div>
    </main>
    <aside id="shop" class="hidden">
      <h2>SHOP <button id="btn-shop-toggle">HIDE</button></h2>
      <h3>PERKS</h3><div id="shop-items" class="slots"></div>
      <button id="btn-reroll" class="wide">REROLL $2</button>
      <div class="shop-pair">
        <div class="shop-box"><h3>UPGRADE</h3><div id="shop-voucher" class="slots"></div></div>
        <div class="shop-box"><h3>PACKS</h3><div id="shop-packs" class="slots"></div></div>
      </div>
      <div id="pending" class="hidden"><span id="pending-label"></span> <button id="btn-discard">DISCARD</button></div>
      <button id="btn-next" class="wide">NEXT ROUND &gt;</button>
      <p id="shop-hint"></p>
    </aside>
  </section>
  <div id="pack-modal" class="hidden"><div class="box">
    <h2 id="pack-title"></h2><p id="pack-sub"></p>
    <div id="pack-choices" class="cards"></div>
    <div id="pack-tray"></div>
    <div class="pack-btns"><button id="btn-pack-skip">SKIP</button></div>
  </div></div>
  <div id="modal" class="hidden"><div class="box"><h2 id="modal-title"></h2><div id="modal-body"></div><div id="modal-btns"></div></div></div>
  <div id="tip" class="hidden"></div>
  <div id="hover-label" class="hidden"></div>
  <div id="flash"></div><div id="big"></div><div id="toast"></div>
</div>
<div id="crt"></div>
<script>// ---- balance.js
(function (GF) {
  'use strict';
  let nextId = 1;
  const C = {
    SIZE: 8,
    COLORS: ['red', 'blue', 'green', 'yellow', 'purple', 'white', 'orange'],
    HOT: [0, 6, 3],
    COLD: [2, 1, 4],
    START_MONEY: 10,
    START_SLOTS: 5,
    MAX_SLOTS: 10,
    START_MOVES: 20,
    MAX_EXTRA_MOVES: 5,

  // ---------- input ----------
  // FLIP helpers: record the perk cards' rects (keyed by uid), change the DOM, then animate each card from its old spot.

    return m;
  }
  function flipPlay(first, except) {
    Array.from($('perk-row').children).forEach((c) => {
      const f = first[c.dataset.uid];
      if (!f || c === except || !c.animate) return;
      const n = c.getBoundingClientRect(), dx = f.left - n.left, dy = f.top - n.top;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
      c.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }], { duration: 150, easing: 'ease-out' });
    });
  }
  function bindPerkCard(el) {
    el.addEventListener('pointerdown', (e) => {
      if (!S.run || (e.pointerType === 'mouse' && e.button !== 0)) return;
      // the row is only rebuilt when the board is idle, so look the perk up by uid, not by a captured index
      const i = S.run.perks.findIndex((p) => p.uid === +el.dataset.uid);
      if (i < 0) return;
      e.preventDefault();
      const row = $('perk-row');

        const dx = ev.clientX - grabX - n.left, dy = ev.clientY - grabY - n.top;
        const rot = Math.max(-12, Math.min(12, vx * 0.6));
        el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.1) rotate(' + rot + 'deg)';
      };

        return k;

        }
        const k = indexAt(ev.clientX);
        if (k !== cur) {
          const first = flipRects(el);
          const sibs = Array.from(row.children).filter((c) => c !== el);
          if (k >= sibs.length) row.appendChild(el); else row.insertBefore(el, sibs[k]);
          cur = k;
          flipPlay(first, el);
        }
        place(ev);
      };
      const detach = () => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        document.removeEventListener('pointercancel', cancel);
      };
      const cancel = () => { detach(); if (dragging) refresh(); };
      const up = () => {
        detach();
        if (!dragging) { showPerkTip(el, i); return; }
        if (cur !== i && GF.Shop.movePerk(S.run, i, cur) && S.run.phase === 'shop') GF.Run.save(S.run);
        // settle: drop the lift transform and glide into the slot, then rebuild the row from the data
        el.style.transition = 'transform .15s ease-out';
        el.style.transform = 'none';
        setTimeout(() => refresh(), 160);
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', cancel);
    });
  }
  async function placePending(cell) {
    const run = S.run, p = run.pendingPlace[0];
    if (p.kind === 'tile' && run.board.tiles[cell.r][cell.c]) {
      const ok = await modal('REPLACE TILE?', '<p>This cell already has a ' + GF.Tiles.DEFS[run.board.tiles[cell.r][cell.c]].name + '.</p>', [['REPLACE', true], ['CANCEL', false]]);
      if (!ok) return;
    }
    const r = GF.Packs.place(run, cell.r, cell.c);
    if (!r.ok) { GF.Audio.bad(); toast(p.kind === 'gem' ? 'PICK A NORMAL GEM' : 'CANNOT PLACE HERE'); return; }
    if (p.kind === 'gem') GF.Audio.created(p.id); else GF.Audio.ching();
    GF.Render.pulseTile(cell.r, cell.c);
    GF.Anim.sync(run.board); GF.Run.save(run); refresh();
  }
  function bindBoard() {
    const cv = $('board');
    let down = null, lp = null;
    const clearLp = () => { if (lp) { clearTimeout(lp); lp = null; } };
    cv.addEventListener('pointerdown', (e) => {
      const run = S.run;
      if (!run || S.locked) return;
      const cell = GF.Render.cellAt(e.clientX, e.clientY);
      if (!cell) return;
      e.preventDefault();
      if (S.targeting != null) { doUseCard(S.targeting, cell); return; }
      if (run.phase === 'shop' && run.pendingPlace.length) { placePending(cell); return; }
      if (run.phase !== 'play') { showCellTip(cell); return; }
      down = { cell: cell, x: e.clientX, y: e.clientY };
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      clearLp();
      lp = setTimeout(() => { if (down) { showCellTip(down.cell); down = null; } }, 500);
    });
    cv.addEventListener('pointermove', (e) => {
      if (!down || S.locked) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < GF.Render.cellPx() * 0.4) return;
      clearLp();
      const a = down.cell;
      const b = Math.abs(dx) > Math.abs(dy) ? { r: a.r, c: a.c + Math.sign(dx) } : { r: a.r + Math.sign(dy), c: a.c };
      down = null;
      trySwap(a, b);
    });
    cv.addEventListener('pointerup', () => {
      clearLp();
      if (!down) return;
      const cell = down.cell, sel = S.selected;
      down = null;
      if (sel && Math.abs(sel.r - cell.r) + Math.abs(sel.c - cell.c) === 1) trySwap(sel, cell);
      else if (sel && sel.r === cell.r && sel.c === cell.c) S.selected = null;
      else if (settled(cell)) { S.selected = cell; S.selectedAt = performance.now(); } // a busy cell just doesn't select
    });
    cv.addEventListener('pointercancel', () => { clearLp(); down = null; });
    cv.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const cell = GF.Render.cellAt(e.clientX, e.clientY);
      if (cell && S.run) showCellTip(cell);
    });
  }

  // ---------- flow ----------
  function layout() {
    const w = window.innerWidth, h = window.innerHeight, mobile = w < 760;
    document.body.classList.toggle('mobile', mobile);
    const shopOpen = S.run && S.run.phase === 'shop';
    const availW = mobile ? w - 24 : w - 220 - (shopOpen ? 320 : 0) - 64;
    const availH = (mobile ? h - 330 - 30 : h - 190) - 36; // 30: mobile cascade row; 36: HINT button
    GF.Render.resize(Math.max(28, Math.min(72, Math.floor(Math.min(availW, availH) / 8))));
    $('board-col').style.setProperty('--board-h', ($('board').offsetHeight || 0) + 'px');
  }
  function toTitle() {
    GF.Anim.cancelAll(); S.live = []; S.locked = false;
    S.run = null; S.targeting = null; S.selected = null; S.hint = null; $('pack-modal').classList.add('hidden');
    show('screen-title');
    $('btn-continue').classList.toggle('hidden', !GF.Run.hasSave());
  }
  function newRun() {
    const txt = $('seed-input').value.trim();
    const seed = txt ? (/^\d+$/.test(txt) ? +txt : GF.RNG.hash(txt)) : undefined;
    S.run = GF.Run.create(seed);
    GF.Anim.cancelAll(); S.live = []; S.locked = false;
    S.cp = null; renderCascadePanel();
    show('screen-game');
    $('shop').classList.add('hidden');
    GF.Anim.sync(S.run.board);
    S.roundMoves = S.run.movesLeft; S.lastLeft = null;
    GF.Run.save(S.run);
    layout(); refresh();
    roundBanner('ROUND 1');
  }
  function resume(run) {
    GF.Anim.cancelAll(); S.live = []; S.locked = false;
    S.run = run; S.cp = null; renderCascadePanel();
    show('screen-game');
    GF.Anim.sync(run.board);
    if (run.phase === 'shop') enterShop();
    else if (run.phase === 'victory') { layout(); refresh(); victory(); }
    else { run.phase = 'play'; S.roundMoves = run.movesLeft; S.lastLeft = null; $('shop').classList.add('hidden'); layout(); refresh(); }
  }
  function enterShop() {
    const run = S.run;
    if (!run.shop) GF.Shop.open(run);
    run.phase = 'shop';
    S.locked = false;
    $('shop').classList.remove('hidden', 'collapsed');
    $('toast').classList.remove('on'); $('big').classList.remove('on'); $('board-banner').classList.remove('on');
    GF.Run.save(run);
    layout(); refresh();
    if (run.openPack) openPackModal();
  }
  function startRound() {
    if (animating() || !S.run || S.run.phase !== 'shop') return;
    const run = S.run;
    hideTip();
    const events = GF.Run.startRound(run);
    if (!events) { toast('FINISH YOUR PACK FIRST'); return; }
    S.targeting = null; S.hint = null; S.locked = false; S.roundMoves = run.movesLeft; S.lastLeft = null;
    $('shop').classList.add('hidden');
    GF.Anim.sync(run.board);
    GF.Run.save(run);
    layout(); refresh();
    roundBanner('ROUND ' + run.round);
    events.forEach((e, i) => setTimeout(() => {
      hooks.float(e.r, e.c, String(e.gem.kind).toUpperCase(), 'money');
      GF.Audio.created(e.gem.kind);
      GF.Render.pulseTile(e.r, e.c);
    }, 300 + i * 150));
  }
  // Accepts a swap even while other moves animate (Blitz-style), as long as both cells are settled.
  // Returns true when the move happened. Never awaits the animation: callers (and tools) get control back at once.
  function trySwap(a, b) {
    const run = S.run;
    if (!run || S.locked || run.phase !== 'play') return false;
    S.selected = null; S.hint = null;
    const busy = GF.Anim.busyCells();
    const before = run.score, uids = run.perks.map((p) => p.uid);
    const res = settled(a, busy) && settled(b, busy) ? GF.Run.doMove(run, a, b) : null;
    if (!res) {
      GF.Audio.bad();
      if (GF.Anim.atRest(a.r, a.c) && (!inBoard(b) || GF.Anim.atRest(b.r, b.c))) GF.Anim.bump(a, b);
      return false;
    }
    for (const st of res.timeline) if (st.t === 'perk' && st.slot != null) st.uid = uids[st.slot];
    if (!animating()) S.shownScore = before;
    const ctx = { total: null, level: 1, t: 0, cp: { cascades: 0, gems: 0 } }; // t: last widget update (0 = none yet)
    if (!S.live.length) { S.cp = ctx.cp; renderCascadePanel(); }
    S.live.push(ctx);
    const ending = run.phase !== 'play'; // won or over: lock input, let every timeline finish, then the modal
    if (ending) S.locked = true;
    const done = GF.Anim.run(res.timeline, makeHooks(ctx));
    refreshHud();
    if (ending) GF.Anim.idle().then(() => endRound(run, res));
    else done.then(settleIfIdle);
    return true;
  }
  function checkDisplay() {
    if (displayMatchesBoard()) return;
    S.desyncs++;
    console.error('GF: display drifted from the logic board; resyncing');
  }
  // When the last timeline ends: verify, resync (safety), and redraw what waits for idle (perk row, hint button).
  function settleIfIdle() {
    const run = S.run;
    if (!run || animating() || S.locked) return;
    checkDisplay();
    GF.Anim.sync(run.board);
    S.shownScore = run.score;
    refresh();
  }
  async function endRound(run, res) {
    if (S.run !== run) return; // left the run meanwhile
    checkDisplay();
    if (res.insured) toast('INSURANCE!');
    GF.Anim.sync(run.board);
    S.shownScore = run.score;
    refresh();
    if (run.phase === 'won') await roundWon();
    else if (run.phase === 'over') await gameOver();
  }
  function animateMoney(from, to, ms) {
    return new Promise((resolve) => {
      const t0 = performance.now(), el = $('hud-money');
      const tick = () => {
        const p = Math.min(1, (performance.now() - t0) / ms);
        el.textContent = money(Math.round(from + (to - from) * p));
        if (p >= 1) { clearInterval(iv); resolve(); }
      };
      const iv = setInterval(tick, 30);
      tick();
    });
  }
  async function roundWon() {
    const run = S.run;
    GF.Audio.win();
    S.frozen = { score: run.score, movesLeft: run.movesLeft, money: run.money, round: run.round };
    const before = run.money;
    const info = GF.Run.finishRound(run);
    info.steps.forEach((st) => hooks.perkFire(st));
    refresh();
    const rows = [['Win reward', info.base], ['Moves left (' + info.leftover + ', $1 per 2)', info.leftoverIncome]];
    if (info.perkIncome || info.perkMoney) rows.push(['Perks', info.perkIncome + info.perkMoney]);
    if (info.interest > 0) rows.push(['Interest ($1 per $5, max $10)', info.interest]);
    const html = '<div class="payout">' + rows.map(([l, v]) => '<div class="row"><span>' + l + '</span><i></i><b>' + (v < 0 ? '-$' + (-v) : '$' + v) + '</b></div>').join('') + '</div>';
    await modal('ROUND CLEAR!', html, [['OBTAIN ' + money(info.total), true]]);
    S.frozen = null;
    await animateMoney(before, run.money, 400);
    refresh();
    if (run.phase === 'victory') { GF.Run.save(run); await victory(); } else enterShop();
  }
  async function victory() {
    const run = S.run;
    const v = await modal('VICTORY!', '<p>You beat all ' + C.ROUNDS + ' rounds.</p><p>Best move <b>' + fmt(run.stats.bestMove) + '</b></p><p>Seed <b>' + run.seed + '</b></p>', [['ENDLESS', 'endless'], ['MENU', 'menu']]);
    if (v === 'endless') { GF.Run.continueEndless(run); enterShop(); } else { GF.Run.clearSave(); toTitle(); }
  }
  async function gameOver() {
    const run = S.run;
    GF.Audio.lose();
    GF.Run.clearSave();
    await modal('GAME OVER', '<p>Reached round <b>' + run.round + '</b>' + (run.endless ? ' (endless)' : '') + '</p><p>Score <b>' + fmt(run.score) + ' / ' + fmt(GF.Run.targetFor(run, run.round)) + '</b></p><p>Best move <b>' + fmt(run.stats.bestMove) + '</b></p><p>Seed <b>' + run.seed + '</b></p>', [['MENU', true]]);
    toTitle();
  }
  function updateToggles() {
    const m = GF.Audio.isMuted();
    $('btn-mute').textContent = m ? 'SND OFF' : 'SND ON';
    $('btn-mute-t').textContent = 'SOUND: ' + (m ? 'OFF' : 'ON');
    $('btn-crt').textContent = S.crt ? 'CRT ON' : 'CRT OFF';
    $('btn-crt-t').textContent = 'CRT: ' + (S.crt ? 'ON' : 'OFF');
    document.body.classList.toggle('crt', S.crt);
    $('btn-speed').textContent = SPEEDS[S.speedIdx] + 'x';
  }
  function loop(now) {
    GF.Anim.update(now);
    if (S.selected && S.run && animating() && !settled(S.selected)) S.selected = null; // a selected gem that becomes busy loses selection
    if (S.run) GF.Render.frame({ display: GF.Anim.display, board: S.run.board, selected: S.selected, selectedAt: S.selectedAt, busy: S.locked, hint: S.hint, placing: !!(S.run.pendingPlace && S.run.pendingPlace.length) || S.targeting != null, time: now });
    requestAnimationFrame(loop);
  }
  function findMove() {
    const run = S.run;
    if (!run) return null;
    const f = GF.Perks.flags(run.perks), cols = GF.Run.colors(run);
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      if (c < 7 && GF.Board.canSwap(run.board, { r: r, c: c }, { r: r, c: c + 1 }, f, cols)) return { a: { r: r, c: c }, b: { r: r, c: c + 1 } };
      if (r < 7 && GF.Board.canSwap(run.board, { r: r, c: c }, { r: r + 1, c: c }, f, cols)) return { a: { r: r, c: c }, b: { r: r + 1, c: c } };
    }
    return null;
  }
  // A logic-valid swap whose two cells are settled (for tools; mirrors what a player could do right now).
  function findSettledMove() {
    const run = S.run;
    if (!run || S.locked || run.phase !== 'play') return null;
    const f = GF.Perks.flags(run.perks), cols = GF.Run.colors(run), busy = GF.Anim.busyCells();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const a = { r: r, c: c };
      for (const b of [{ r: r, c: c + 1 }, { r: r + 1, c: c }]) {
        if (inBoard(b) && settled(a, busy) && settled(b, busy) && GF.Board.canSwap(run.board, a, b, f, cols)) return { a: a, b: b };
      }
    }
    return null;
  }
  function state() {
    const r = S.run;
    const hint = !!S.hint && performance.now() < S.hint.until;
    const anims = GF.Anim.active();
    return r ? { phase: r.phase, busy: anims > 0, anims: anims, locked: S.locked, desyncs: S.desyncs, movesLeft: r.movesLeft, score: r.score, round: r.round, money: r.money, hint: hint }
      : { phase: 'title', busy: anims > 0, anims: anims, locked: S.locked, desyncs: S.desyncs, hint: false };
  }
  function init() {
    GF.Render.init($('board'));
    S.crt = prefGet('crt') !== '0';
    S.speedIdx = (+(prefGet('speed') || 0)) % 3;
    GF.Anim.speed = SPEEDS[S.speedIdx];
    updateToggles();
    $('btn-new').onclick = () => { GF.Audio.unlock(); newRun(); };
    $('btn-continue').onclick = () => { GF.Audio.unlock(); const r = GF.Run.load(); if (r) resume(r); else toTitle(); };
    [$('btn-mute'), $('btn-mute-t')].forEach((b) => { b.onclick = () => { GF.Audio.setMuted(!GF.Audio.isMuted()); updateToggles(); }; });
    [$('btn-crt'), $('btn-crt-t')].forEach((b) => { b.onclick = () => { S.crt = !S.crt; prefSet('crt', S.crt ? '1' : '0'); updateToggles(); }; });
    $('btn-speed').onclick = () => { S.speedIdx = (S.speedIdx + 1) % 3; GF.Anim.speed = SPEEDS[S.speedIdx]; prefSet('speed', String(S.speedIdx)); updateToggles(); };
    $('btn-reroll').onclick = () => { $('shop').classList.remove('collapsed'); act(GF.Shop.reroll(S.run)); };
    $('btn-pack-skip').onclick = () => { GF.Packs.skip(S.run); GF.Run.save(S.run); openPackModal(); };
    $('btn-discard').onclick = () => { GF.Packs.discardPending(S.run); GF.Run.save(S.run); refresh(); };
    $('btn-next').onclick = () => startRound();
    $('btn-hint').onclick = showHint;
    $('btn-shop-toggle').onclick = () => $('shop').classList.toggle('collapsed');
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { S.targeting = null; hideTip(); $('shop').classList.remove('collapsed'); if (S.run) refresh(); } });
    document.addEventListener('pointerdown', (e) => { if (!$('tip').contains(e.target)) hideTip(); }, true);
    const scoreStat = $('hud-score').parentElement;
    const scoreTip = () => {
      if (!S.run) return;
      const st = S.run.stats;
      showTip(scoreStat.getBoundingClientRect(), '<b>SCORE</b><p>Best move (round): ' + fmt(st.bestMoveRound) + '</p><p>Best move (run): ' + fmt(st.bestMove) + '</p>');
      scoreTipOpen = true;
    };
    let scoreTipOpen = false;
    scoreStat.style.cursor = 'help';
    scoreStat.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') scoreTip(); });
    scoreStat.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && scoreTipOpen) hideTip(); });
    scoreStat.addEventListener('click', scoreTip);
    bindBoard();
    window.addEventListener('resize', layout);
    layout();
    toTitle();
    requestAnimationFrame(loop);
  }

  GF.UI = { init: init, state: state, findMove: findMove, findSettledMove: findSettledMove, trySwap: trySwap, displayMatchesBoard: displayMatchesBoard, debugRun: () => S.run, refresh: refresh };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})(typeof window !== 'undefined' ? (window.GF = window.GF || {}) : (globalThis.GF = globalThis.GF || {}));
</script>

</body>
</html>
